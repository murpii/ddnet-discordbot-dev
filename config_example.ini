BAN-APPEAL =
VPN-BAN-APPEAL =
RENAME =
ADMIN-MAIL =
COMPLAINT =

[TRANSCRIPTS]
; Upload limits for ticket transcripts, in MBs
; Server's per file upload cap, which depends on the boost tier:
; tier 0-1 = 10, tier 2 = 50, tier 3 = 100
; Leave a little headroom for zip header overhead.
MAX_ZIP_SIZE_MB =
MAX_ATTACHMENT_SIZE_MB =

[GAMESERVERS]
ALL_LOCATIONS_FILE =
SSH_USER =
